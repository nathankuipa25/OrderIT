<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2340" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OrderIT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-6-7.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-6-1.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-12-9.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="stylesheet" href="/offline.css" />
    <title>OrderIT — Shop Workspace</title>
  </head>
  <body>
    <main class="app-frame">
      <header class="app-header">
        <a class="brand" href="/offline.html" aria-label="OrderIT shop workspace">
          <img src="/icons/icon-192.png" width="42" height="42" alt="" />
          <span>OrderIT</span>
        </a>
        <a class="header-link" href="/" aria-label="Open full OrderIT">Full app</a>
      </header>
      <div id="app" aria-live="polite">
        <section class="card loading" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <p>Checking this device’s shop workspace…</p>
        </section>
      </div>
      <footer class="privacy-note">Offline orders are stored on this device. Anyone with access to this device or browser profile may be able to view them.</footer>
    </main>
    <script type="module" src="/offline-app.js"></script>
  </body>
</html>
